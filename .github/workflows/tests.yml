name: Run Tests

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'
  # Scheduled runs always use the default branch. This refreshes master's
  # ccache, which every branch can restore, before GitHub evicts it after 7
  # days without use.
  schedule:
    - cron: '17 3 * * 5'  # Fridays 03:17 UTC, so the cache is warm for weekend work
  # Allows manually running on master (e.g. to seed the cache).
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: true
      
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: openmrn

      - name: Checkout googletest
        uses: actions/checkout@v4
        with:
          repository: google/googletest
          ref: v1.16.0
          path: googletest

      - name: Install dependent packages
        run: sudo apt install -y libavahi-client-dev libssl-dev ccache

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ github.ref }}-${{ github.sha }}
          # Note: GitHub only lets a run restore caches from its own ref or
          # from the default branch, so a new branch is cold until master has
          # a cache.
          restore-keys: |
            ccache-${{ runner.os }}-${{ github.ref }}-
            ccache-${{ runner.os }}-

      - name: Look at proc
        run: cat /proc/cpuinfo
        
      - name: Run tests
        run: |
          echo "concurrency: " ${{ github.workflow }}-${{ github.sha }}
          export PATH="/usr/lib/ccache:$PATH"
          ccache --zero-stats
          cd openmrn
          TESTBLACKLIST="utils/SocketClient.cxxtest openlcb/IfTcp.cxxtest"
          make -j5 -k tests TESTBLACKLIST="$TESTBLACKLIST" || \
          { echo "Retrying failed tests in parallel (attempt 2)..."; make -j5  -k tests TESTBLACKLIST="$TESTBLACKLIST"; } || \
          { echo "Retrying failed tests sequentially with tests-single (attempt 3)..."; make -j5 tests-single TESTBLACKLIST="$TESTBLACKLIST"; }

      - name: ccache statistics
        if: always()
        run: ccache --show-stats --verbose

      # Save even when the tests failed, so that the next run is warm.
      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ github.ref }}-${{ github.sha }}
